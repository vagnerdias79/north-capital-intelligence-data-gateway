<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>NCI · Read-Only Auth Test v0.8</title>
<style>
body{font-family:Arial,sans-serif;background:#06111d;color:#e8eef5;margin:0;padding:40px}
.card{max-width:820px;margin:auto;background:#0b2033;border:1px solid #274761;border-radius:14px;padding:24px}
h1{margin-top:0;font-size:22px}.muted{color:#9bb1c3;font-size:14px}
button{background:#d6ad32;color:#07111d;border:0;border-radius:8px;padding:12px 16px;font-weight:700;cursor:pointer}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 16px}
button.secondary{background:#17344c;color:#e8eef5}
pre{white-space:pre-wrap;word-break:break-word;background:#06111d;border:1px solid #274761;padding:14px;border-radius:8px;min-height:150px}
.ok{color:#66e59a}.bad{color:#ff7a7a}.warn{color:#ffd166}
</style>
</head>
<body>
<div class="card">
<h1>North Capital Intelligence · Read-Only Auth Test v0.8</h1>
<p class="muted">Ambiente isolado. Não altera a USD 1.1.02. Valida sessão, JWT e leitura autenticada de portfolios, positions e reconciliação do ledger.</p>
<p id="status">Inicializando...</p>
<p class="actions">
<button id="login" hidden>Entrar com Google</button>
<button id="read" class="secondary" hidden>Ler portfolios</button>
<button id="readPositions" class="secondary" hidden>Ler positions</button>
<button id="readLedger" class="secondary" hidden>Reconciliar ledger</button>
<button id="readTax" class="secondary" hidden>Analisar TAX</button>
<button id="simulateTax" class="secondary" hidden>Simular TAX 2.3</button>
<button id="compareTax" class="secondary" hidden>Comparar TAX 2.4</button>
<button id="logout" class="secondary" hidden>Sair</button>
</p>
<pre id="out"></pre>
</div>

<script type="module">
import { createAuthClient } from 'https://esm.sh/@neondatabase/auth';

const $ = id => document.getElementById(id);
const status = $('status'), out = $('out'), login = $('login'), read = $('read'), readPositions = $('readPositions'), readLedger = $('readLedger'), readTax = $('readTax'), simulateTax = $('simulateTax'), compareTax = $('compareTax'), logout = $('logout');
const show = value => { out.textContent = typeof value === 'string' ? value : JSON.stringify(value,null,2); };

function looksLikeJwt(v){
  return typeof v === 'string' && v.split('.').length === 3 && v.length > 80;
}

function findJwt(value, depth=0, seen=new Set()){
  if (depth > 8 || value == null) return null;
  if (looksLikeJwt(value)) return value;
  if (typeof value !== 'object') return null;
  if (seen.has(value)) return null;
  seen.add(value);

  const preferred = ['jwt','token','accessToken','access_token','idToken','id_token'];
  for (const key of preferred){
    if (key in value && looksLikeJwt(value[key])) return value[key];
  }
  for (const v of Object.values(value)){
    const found = findJwt(v, depth+1, seen);
    if (found) return found;
  }
  return null;
}

let auth;
let lastSessionResult = null;

async function init(){
  try{
    const cfgResp = await fetch('/api/v2/auth-config',{cache:'no-store'});
    const cfg = await cfgResp.json();
    if(!cfg.ok) throw new Error(cfg.error || 'Auth config unavailable');

    auth = createAuthClient(cfg.authBaseUrl);
    lastSessionResult = await auth.getSession();

    const session = lastSessionResult?.data ?? lastSessionResult ?? null;
    const user = session?.user ?? lastSessionResult?.data?.user ?? null;
    const jwt = findJwt(lastSessionResult);

    if(user){
      status.innerHTML = '<span class="ok">Sessão Neon Auth autenticada.</span>';
      show({
        phase:'SESSION_READY',
        user:{
          id:user.id ?? null,
          email:user.email ?? null,
          name:user.name ?? null,
          emailVerified:user.emailVerified ?? null
        },
        sessionJwtDetected:Boolean(jwt),
        next:'Clique em “Ler portfolios”.'
      });
      read.hidden=false;
      readPositions.hidden=false;
      readLedger.hidden=false;
      readTax.hidden=false;
      simulateTax.hidden=false;
      compareTax.hidden=false;
      logout.hidden=false;
    }else{
      status.innerHTML='<span class="warn">Nenhuma sessão ativa.</span>';
      show('Use “Entrar com Google”.');
      login.hidden=false;
    }
  }catch(e){
    status.innerHTML='<span class="bad">Falha de inicialização.</span>';
    show({message:String(e?.message||e)});
  }
}

login.addEventListener('click', async ()=>{
  status.textContent='Redirecionando para Google...';
  try{
    const result = await auth.signIn.social({
      provider:'google',
      callbackURL:`${location.origin}/auth-test.html`
    });
    if(result?.error){
      status.innerHTML='<span class="bad">Falha no login.</span>';
      show(result.error);
    }
  }catch(e){
    status.innerHTML='<span class="bad">Falha ao iniciar Google OAuth.</span>';
    show(String(e?.message||e));
  }
});

read.addEventListener('click', async ()=>{
  status.textContent='Lendo JWT da sessão e consultando portfolios...';
  try{
    lastSessionResult = await auth.getSession();
    const session = lastSessionResult?.data ?? lastSessionResult ?? null;
    const user = session?.user ?? null;
    const token = findJwt(lastSessionResult);

    if(!token){
      status.innerHTML='<span class="bad">Sessão válida, mas JWT não localizado.</span>';
      show({
        auth:'PASS',
        user:{id:user?.id??null,email:user?.email??null},
        diagnostic:Object.keys(session||{}),
        instruction:'Nenhuma chamada de token adicional foi feita.'
      });
      return;
    }

    const resp = await fetch('/api/v2/portfolios',{
      method:'GET',
      headers:{Authorization:`Bearer ${token}`},
      cache:'no-store'
    });
    const data = await resp.json();

    if(resp.status===403 && data?.error==='IDENTITY_NOT_LINKED'){
      status.innerHTML='<span class="warn">Auth PASS; vínculo NCI pendente.</span>';
      show({
        auth:'PASS',
        jwt:'PASS',
        api:data,
        newAuthUserId:user?.id??null,
        instruction:'Atualizar somente app_users.auth_subject para este novo Auth User ID.'
      });
      return;
    }

    status.innerHTML=data?.ok
      ? '<span class="ok">READ-ONLY autenticado — PASS.</span>'
      : '<span class="bad">Consulta autenticada falhou.</span>';
    show(data);
  }catch(e){
    status.innerHTML='<span class="bad">Falha no teste autenticado.</span>';
    show(String(e?.message||e));
  }
});


readPositions.addEventListener('click', async ()=>{
  status.textContent='Lendo JWT da sessão e consultando positions...';
  try{
    lastSessionResult = await auth.getSession();
    const session = lastSessionResult?.data ?? lastSessionResult ?? null;
    const user = session?.user ?? null;
    const token = findJwt(lastSessionResult);

    if(!token){
      status.innerHTML='<span class="bad">Sessão válida, mas JWT não localizado.</span>';
      show({
        auth:'PASS',
        user:{id:user?.id??null,email:user?.email??null},
        instruction:'JWT não localizado na sessão.'
      });
      return;
    }

    const resp = await fetch('/api/v2/positions',{
      method:'GET',
      headers:{Authorization:`Bearer ${token}`},
      cache:'no-store'
    });
    const data = await resp.json();

    if(resp.ok && data?.ok){
      const checks = {
        readOnly: data.mode === 'READ_ONLY',
        authenticated: data.authenticated === true,
        portfolio: data.portfolio?.code === 'USD-INTL',
        frozen: data.portfolio?.status === 'FROZEN',
        baseline: data.portfolio?.baselineVersion === 'NCI USD 1.1.02',
        count21: Number(data.count) === 21,
        equity20: Number(data.totals?.equityCount) === 20,
        cash1: Number(data.totals?.cashCount) === 1,
        invested2518_48: Number(data.totals?.investedUsd) === 2518.48,
        fingerprint: data.positionBaseline?.fingerprint === 'NCI-POS-F568E4710310',
        writesBlocked: data.writeOperationsEnabled === false
      };
      const pass = Object.values(checks).every(Boolean);

      status.innerHTML = pass
        ? '<span class="ok">POSITIONS READ-ONLY — PASS.</span>'
        : '<span class="warn">POSITIONS lidas com divergência.</span>';

      show({
        validation: pass ? 'PASS' : 'PASS_WITH_WARNINGS',
        checks,
        response: data
      });
      return;
    }

    status.innerHTML='<span class="bad">Consulta de positions falhou.</span>';
    show(data);
  }catch(e){
    status.innerHTML='<span class="bad">Falha no teste de positions.</span>';
    show(String(e?.message||e));
  }
});

readLedger.addEventListener('click', async ()=>{
  status.textContent='Reconciliando 85 pares do ledger em modo read-only...';
  try{
    lastSessionResult = await auth.getSession();
    const token = findJwt(lastSessionResult);
    if(!token){
      status.innerHTML='<span class="bad">Sessão válida, mas JWT não localizado.</span>';
      show({auth:'PASS',instruction:'JWT não localizado na sessão.'});
      return;
    }

    const resp = await fetch('/api/v2/ledger-reconciliation',{
      method:'GET',
      headers:{Authorization:`Bearer ${token}`},
      cache:'no-store'
    });
    const data = await resp.json();
    status.innerHTML = resp.ok && data?.validation === 'PASS'
      ? '<span class="ok">LEDGER READ-ONLY — PASS.</span>'
      : '<span class="warn">LEDGER READ-ONLY — revisão necessária.</span>';
    show(data);
  }catch(e){
    status.innerHTML='<span class="bad">Falha na reconciliação read-only.</span>';
    show(String(e?.message||e));
  }
});


readTax.addEventListener('click', async ()=>{
  status.textContent='Analisando os nove pares TAX em modo read-only...';
  try{
    lastSessionResult = await auth.getSession();
    const token = findJwt(lastSessionResult);
    if(!token){
      status.innerHTML='<span class="bad">Sessão válida, mas JWT não localizado.</span>';
      show({auth:'PASS',instruction:'JWT não localizado na sessão.'});
      return;
    }

    const resp = await fetch('/api/v2/ledger-tax-diagnostics',{
      method:'GET',
      headers:{Authorization:`Bearer ${token}`},
      cache:'no-store'
    });
    const data = await resp.json();
    status.innerHTML = resp.ok && data?.validation === 'PASS'
      ? '<span class="ok">TAX READ-ONLY — PASS.</span>'
      : '<span class="warn">TAX READ-ONLY — revisão necessária.</span>';
    show(data);
  }catch(e){
    status.innerHTML='<span class="bad">Falha no diagnóstico TAX read-only.</span>';
    show(String(e?.message||e));
  }
});


simulateTax.addEventListener('click', async ()=>{
  status.textContent='Simulando efeito de caixa TAX 2.3 em modo read-only...';
  try{
    lastSessionResult = await auth.getSession();
    const token = findJwt(lastSessionResult);
    if(!token){
      status.innerHTML='<span class="bad">Sessão válida, mas JWT não localizado.</span>';
      show({auth:'PASS',instruction:'JWT não localizado na sessão.'});
      return;
    }

    const resp = await fetch('/api/v2/tax-cash-effect-simulation',{
      method:'GET',
      headers:{Authorization:`Bearer ${token}`},
      cache:'no-store'
    });
    const data = await resp.json();
    status.innerHTML = resp.ok && data?.validation === 'PASS'
      ? '<span class="ok">TAX CASH EFFECT 2.3 — PASS.</span>'
      : '<span class="warn">TAX CASH EFFECT 2.3 — revisão necessária.</span>';
    show(data);
  }catch(e){
    status.innerHTML='<span class="bad">Falha na simulação TAX 2.3.</span>';
    show(String(e?.message||e));
  }
});


compareTax.addEventListener('click', async ()=>{
  status.textContent='Comparando TAX normalizado e legado em modo shadow read-only...';
  try{
    lastSessionResult = await auth.getSession();
    const token = findJwt(lastSessionResult);
    if(!token){
      status.innerHTML='<span class="bad">Sessão válida, mas JWT não localizado.</span>';
      show({auth:'PASS',instruction:'JWT não localizado na sessão.'});
      return;
    }

    const resp = await fetch('/api/v2/tax-cash-effect-simulation?mode=shadow',{
      method:'GET',
      headers:{Authorization:`Bearer ${token}`},
      cache:'no-store'
    });
    const data = await resp.json();
    status.innerHTML = resp.ok && data?.validation === 'PASS'
      ? '<span class="ok">TAX SHADOW 2.4 — PASS.</span>'
      : '<span class="warn">TAX SHADOW 2.4 — revisão necessária.</span>';
    show(data);
  }catch(e){
    status.innerHTML='<span class="bad">Falha na comparação TAX 2.4.</span>';
    show(String(e?.message||e));
  }
});

logout.addEventListener('click', async ()=>{
  await auth.signOut();
  location.replace('/auth-test.html');
});

init();
</script>
</body>
</html>
