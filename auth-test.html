<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>NCI · Auth Test</title>
  <style>
    body{font-family:Arial,sans-serif;background:#06111d;color:#e8eef5;margin:0;padding:40px}
    .card{max-width:760px;margin:auto;background:#0b2033;border:1px solid #274761;border-radius:14px;padding:24px}
    h1{margin-top:0;font-size:22px}.muted{color:#9bb1c3;font-size:14px}
    button{background:#d6ad32;color:#07111d;border:0;border-radius:8px;padding:12px 16px;font-weight:700;cursor:pointer;margin-right:8px}
    button.secondary{background:#17344c;color:#e8eef5}
    pre{white-space:pre-wrap;word-break:break-word;background:#06111d;border:1px solid #274761;padding:14px;border-radius:8px;min-height:120px}
    .ok{color:#66e59a}.bad{color:#ff7a7a}
  </style>
</head>
<body>
<div class="card">
  <h1>North Capital Intelligence · Neon Auth Test</h1>
  <p class="muted">Ambiente isolado. Não altera a USD 1.1.02. Testa apenas login Google, JWT e leitura de portfolios.</p>
  <p id="status">Inicializando...</p>
  <p>
    <button id="login" hidden>Entrar com Google</button>
    <button id="read" class="secondary" hidden>Ler portfolios</button>
    <button id="logout" class="secondary" hidden>Sair</button>
  </p>
  <pre id="out"></pre>
</div>

<script type="module">
  import { createAuthClient } from 'https://esm.sh/better-auth@1.3.26/client';
  import { jwtClient } from 'https://esm.sh/better-auth@1.3.26/client/plugins';

  const $ = (id) => document.getElementById(id);
  const status = $('status');
  const out = $('out');
  const login = $('login');
  const read = $('read');
  const logout = $('logout');

  const safeJson = (value) => JSON.stringify(value, null, 2);
  const show = (value) => { out.textContent = typeof value === 'string' ? value : safeJson(value); };

  let authClient;

  try {
    const cfgResp = await fetch('/api/v2/auth-config', { cache: 'no-store' });
    const cfg = await cfgResp.json();
    if (!cfg.ok) throw new Error(cfg.error || 'Auth config unavailable');

    authClient = createAuthClient({
      baseURL: cfg.authBaseUrl,
      plugins: [jwtClient({
        jwks: { jwksPath: '/.well-known/jwks.json' }
      })]
    });

    const sessionResult = await authClient.getSession();
    const session = sessionResult?.data || null;

    if (session?.user) {
      status.innerHTML = '<span class="ok">Sessão autenticada.</span>';
      show({ user: { id: session.user.id, email: session.user.email, name: session.user.name } });
      read.hidden = false;
      logout.hidden = false;
    } else {
      status.textContent = 'Nenhuma sessão ativa.';
      login.hidden = false;
      show('Use “Entrar com Google”.');
    }
  } catch (e) {
    status.innerHTML = '<span class="bad">Falha de inicialização.</span>';
    show(String(e?.message || e));
  }

  login.addEventListener('click', async () => {
    status.textContent = 'Redirecionando para Google...';
    const callbackURL = `${location.origin}/auth-test.html`;
    const result = await authClient.signIn.social({
      provider: 'google',
      callbackURL
    });
    if (result?.error) {
      status.innerHTML = '<span class="bad">Falha no login.</span>';
      show(result.error);
    }
  });

  read.addEventListener('click', async () => {
    status.textContent = 'Obtendo JWT e consultando portfolios...';
    try {
      const tokenResult = await authClient.token();
      const token = tokenResult?.data?.token;
      if (!token) throw new Error(tokenResult?.error?.message || 'JWT não retornado pelo Neon Auth.');

      const resp = await fetch('/api/v2/portfolios', {
        headers: { Authorization: `Bearer ${token}` },
        cache: 'no-store'
      });
      const data = await resp.json();

      status.innerHTML = data?.ok
        ? '<span class="ok">READ-ONLY autenticado — PASS.</span>'
        : '<span class="bad">Consulta autenticada falhou.</span>';
      show(data);
    } catch (e) {
      status.innerHTML = '<span class="bad">Falha no teste autenticado.</span>';
      show(String(e?.message || e));
    }
  });

  logout.addEventListener('click', async () => {
    await authClient.signOut();
    location.replace('/auth-test.html');
  });
</script>
</body>
</html>
