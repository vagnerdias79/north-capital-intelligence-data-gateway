<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>North Capital Intelligence â€” International USD</title>
<style>
:root{--bg:#07111f;--panel:#0d1c2d;--panel2:#10243a;--line:#1e3550;--gold:#d9b45a;--gold2:#f1d788;--text:#eef4fb;--muted:#8fa5bb;--green:#30c483;--red:#ff6b6b;--amber:#f2bd53;--blue:#5ea0ff;--shadow:0 18px 45px rgba(0,0,0,.25);}
*{box-sizing:border-box} body{margin:0;background:radial-gradient(circle at 75% -10%,#143558 0,#07111f 42%);color:var(--text);font:14px/1.45 Inter,Segoe UI,Arial,sans-serif}
button,input,select{font:inherit} .app{display:grid;grid-template-columns:250px 1fr;min-height:100vh}
.sidebar{background:linear-gradient(180deg,#06101c,#091726);border-right:1px solid var(--line);padding:22px 16px;position:sticky;top:0;height:100vh}
.brand{display:flex;align-items:center;gap:12px;padding:0 8px 24px} .brand img{width:52px;height:52px;object-fit:contain} .brand strong{display:block;font-size:15px;letter-spacing:.7px} .brand small{color:var(--gold);letter-spacing:1.5px}
.nav button{width:100%;border:0;background:transparent;color:var(--muted);padding:12px 13px;text-align:left;border-radius:10px;margin:3px 0;cursor:pointer}
.nav button.active,.nav button:hover{background:#10243a;color:#fff;box-shadow:inset 3px 0 0 var(--gold)}
.sidebar-footer{position:absolute;bottom:20px;left:18px;right:18px;color:#6f8397;font-size:11px}
.main{padding:26px 30px 50px;max-width:1700px;width:100%} .topbar{display:flex;justify-content:space-between;gap:20px;align-items:center;margin-bottom:22px}
.eyebrow{color:var(--gold2);font-size:11px;letter-spacing:1.8px;text-transform:uppercase} h1{font-size:27px;margin:5px 0 0;font-weight:650}
.statusbar{display:flex;gap:9px;flex-wrap:wrap;justify-content:flex-end} .pill{border:1px solid var(--line);background:rgba(16,36,58,.75);padding:8px 11px;border-radius:999px;color:var(--muted);font-size:12px}
.pill b{color:#fff} .pill.offline{border-color:#6b5325;color:#e5c36c}
.screen{display:none} .screen.active{display:block} .grid{display:grid;gap:15px} .kpis{grid-template-columns:repeat(4,minmax(0,1fr));margin-bottom:15px}
.card{background:linear-gradient(180deg,rgba(17,38,61,.97),rgba(11,28,45,.97));border:1px solid var(--line);border-radius:15px;box-shadow:var(--shadow);padding:18px}
.kpi .label{color:var(--muted);font-size:12px} .kpi .value{font-size:25px;margin:7px 0 4px;font-weight:650} .positive{color:var(--green)} .negative{color:var(--red)} .warning{color:var(--amber)}
.two{grid-template-columns:1.4fr .8fr} .three{grid-template-columns:repeat(3,1fr)} .section-title{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px} .section-title h2{font-size:15px;margin:0} .section-title span{font-size:11px;color:var(--muted)}
canvas{width:100%;height:260px;display:block} .heatmap{display:grid;grid-template-columns:repeat(auto-fit,minmax(105px,1fr));gap:8px}
.heat{border:1px solid rgba(255,255,255,.08);border-radius:10px;padding:13px 10px;min-height:75px;cursor:pointer;transition:.15s} .heat:hover{transform:translateY(-2px);border-color:var(--gold)} .heat b{font-size:13px} .heat span{display:block;font-size:11px;margin-top:7px}
.legend{display:flex;gap:15px;color:var(--muted);font-size:11px;margin-top:10px} .dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:5px}
.table-wrap{overflow:auto;border-radius:12px;border:1px solid var(--line)} table{width:100%;border-collapse:collapse;min-width:900px;background:rgba(5,16,28,.25)} th{position:sticky;top:0;background:#10243a;color:#b9c9d8;font-size:11px;text-transform:uppercase;letter-spacing:.5px;text-align:left;padding:11px;border-bottom:1px solid var(--line)} td{padding:11px;border-bottom:1px solid rgba(43,68,94,.6)} tr:hover td{background:rgba(94,160,255,.05)} .ticker{font-weight:700;color:#fff;cursor:pointer} .tag{padding:4px 7px;border-radius:999px;background:#172d45;color:#b9c9d8;font-size:10px;white-space:nowrap}
.tag.gold{background:#3b3020;color:#f2d98d} .tag.green{background:#123f32;color:#7ce2b9} .tag.red{background:#49232a;color:#ff9ba7}
.toolbar{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:12px;flex-wrap:wrap} .toolbar .actions{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:#132a43;color:#fff;padding:9px 12px;border-radius:9px;cursor:pointer} .btn:hover{border-color:var(--gold)} .btn.primary{background:linear-gradient(135deg,#d5ad4e,#ad7f25);border:0;color:#07111f;font-weight:700}
.filters{display:flex;gap:8px;flex-wrap:wrap} input,select{background:#0a1928;border:1px solid var(--line);color:#dce8f3;border-radius:8px;padding:8px 10px}
.action-list{display:grid;gap:9px} .action-item{display:grid;grid-template-columns:90px 160px 1fr 125px;gap:12px;align-items:center;border:1px solid var(--line);border-radius:11px;padding:12px;background:rgba(6,18,31,.35)} .action-item strong{font-size:13px}
.policy-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:11px} .policy{padding:14px;border:1px solid var(--line);border-radius:11px;background:rgba(6,18,31,.3)} .policy b{color:var(--gold2);display:block;margin-bottom:5px}
.geo{height:285px;position:relative;overflow:hidden} .globe{position:absolute;width:280px;height:280px;border:1px solid #305675;border-radius:50%;left:50%;top:50%;transform:translate(-50%,-50%);background:radial-gradient(circle at 35% 30%,#1a4163,#0a1c2e 65%);box-shadow:inset 0 0 35px #07111f}
.globe:before,.globe:after{content:"";position:absolute;inset:25px;border:1px solid rgba(133,179,217,.28);border-radius:50%} .globe:after{inset:0 65px}
.geo-line{position:absolute;height:1px;background:rgba(242,215,136,.45);transform-origin:left} .geo-label{position:absolute;background:#112941;border:1px solid var(--line);padding:7px 9px;border-radius:8px;font-size:11px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.66);display:none;align-items:center;justify-content:center;padding:20px;z-index:20} .modal.open{display:flex} .modal-box{width:min(880px,96vw);max-height:90vh;overflow:auto;background:#0b1b2d;border:1px solid #34506b;border-radius:16px;box-shadow:0 30px 80px rgba(0,0,0,.5);padding:22px} .modal-head{display:flex;justify-content:space-between;align-items:flex-start} .modal-close{background:transparent;border:0;color:#fff;font-size:22px;cursor:pointer}
.asset-logo{width:48px;height:48px;border-radius:12px;display:grid;place-items:center;background:linear-gradient(135deg,#1f4e78,#10243a);border:1px solid #315779;color:var(--gold2);font-weight:800}
.detail-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:16px 0} .detail{background:#0f2439;padding:12px;border-radius:10px} .detail small{color:var(--muted)} .detail b{display:block;margin-top:4px}
.backup-box{border:1px dashed #3b5770;border-radius:12px;padding:16px;color:var(--muted)} .note{color:var(--muted);font-size:12px}
.score{font-weight:800;color:var(--gold2)} .progress{height:7px;background:#081522;border-radius:999px;overflow:hidden;margin-top:6px} .progress i{height:100%;display:block;background:linear-gradient(90deg,#c69a3a,#f4df9a)}
@media(max-width:1000px){.app{grid-template-columns:1fr}.sidebar{position:relative;height:auto}.nav{display:flex;overflow:auto}.nav button{min-width:145px}.sidebar-footer{display:none}.kpis,.two,.three,.policy-grid{grid-template-columns:1fr 1fr}}
@media(max-width:680px){.main{padding:18px 13px 40px}.kpis,.two,.three,.policy-grid{grid-template-columns:1fr}.topbar{align-items:flex-start;flex-direction:column}.action-item{grid-template-columns:1fr}.detail-grid{grid-template-columns:1fr 1fr}}
@media print{.sidebar,.topbar,.toolbar button,.filters{display:none!important}.app{display:block}.main{padding:0;max-width:none}.screen{display:block!important;page-break-after:always}body{background:#fff;color:#111}.card,.table-wrap{box-shadow:none;background:#fff;border-color:#ccc;color:#111}th{background:#eee;color:#222}td{color:#111}}
</style>

<style id="nci-live-quality-v101">
.statusbar button.pill{cursor:pointer;font:inherit}.statusbar button.pill:hover{border-color:#d9b45a}.pill.live{border-color:#2f7d55;color:#78d9a7}.pill.syncing{border-color:#7a642c;color:#e6c96e}
.nci-quality{display:inline-flex;align-items:center;gap:4px;border:1px solid #31485b;border-radius:999px;padding:2px 6px;margin-left:6px;font-size:6.5px;letter-spacing:.45px;text-transform:uppercase;vertical-align:middle}.nci-quality.audit{color:#77dfa1;border-color:#2d6d4a;background:#0a2117}.nci-quality.market{color:#79b9ff;border-color:#285b8d;background:#081c30}.nci-quality.collect{color:#e7c968;border-color:#735d22;background:#201a08}.nci-quality.method{color:#c5a8e8;border-color:#5d4778;background:#171020}
</style>
